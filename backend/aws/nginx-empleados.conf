# =============================================================================
# Nginx – Proxy inverso del BACKEND en AWS EC2 (PDA06, Fase 2)
#   http://18.222.83.229   → redirección 301 a HTTPS
#   https://18.222.83.229  → certificado autofirmado → Node.js 127.0.0.1:5000
#
# Lo instala automáticamente:  bash backend/aws/1-preparar-servidor.sh
# Manual:
#   sudo cp backend/aws/nginx-empleados.conf /etc/nginx/sites-available/empleados
#   sudo ln -sf /etc/nginx/sites-available/empleados /etc/nginx/sites-enabled/empleados
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# CORS lo maneja Express (FRONTEND_URL). Nginx no añade cabeceras CORS para
# no duplicarlas.
# =============================================================================

# 1. REDIRECCIÓN DE HTTP A HTTPS USANDO LA IP
server {
    listen 80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# 2. SERVIDOR SEGURO (HTTPS)
server {
    listen 443 ssl default_server;
    server_name _;

    # Certificados autofirmados (los genera 1-preparar-servidor.sh)
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Parámetros de seguridad SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384';

    client_max_body_size 1m;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy inverso hacia Express (PM2, puerto 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
