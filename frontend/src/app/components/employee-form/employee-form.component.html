<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h5 card-title mb-3">{{ isEdit ? 'Editar empleado' : 'Registro de nuevo empleado' }}</h2>

    <form #employeeForm="ngForm" (ngSubmit)="submit(employeeForm)" novalidate>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input id="nombre" name="nombre" type="text" class="form-control" required minlength="3" maxlength="100"
               #nombre="ngModel" [(ngModel)]="model.nombre"
               [class.is-invalid]="nombre.invalid && (nombre.touched || employeeForm.submitted)" />
        <div class="invalid-feedback">Mínimo 3 caracteres.</div>
      </div>

      <div class="mb-3">
        <label for="cargo" class="form-label">Cargo</label>
        <input id="cargo" name="cargo" type="text" class="form-control" required minlength="2" maxlength="80"
               #cargo="ngModel" [(ngModel)]="model.cargo"
               [class.is-invalid]="cargo.invalid && (cargo.touched || employeeForm.submitted)" />
        <div class="invalid-feedback">Mínimo 2 caracteres.</div>
      </div>

      <div class="mb-3">
        <label for="departamento" class="form-label">Departamento</label>
        <input id="departamento" name="departamento" type="text" class="form-control" required minlength="2" maxlength="80"
               #departamento="ngModel" [(ngModel)]="model.departamento"
               [class.is-invalid]="departamento.invalid && (departamento.touched || employeeForm.submitted)" />
        <div class="invalid-feedback">Mínimo 2 caracteres.</div>
      </div>

      <div class="mb-3">
        <label for="sueldo" class="form-label">Sueldo</label>
        <input id="sueldo" name="sueldo" type="number" class="form-control" required min="0.01" step="0.01"
               #sueldo="ngModel" [(ngModel)]="model.sueldo"
               [class.is-invalid]="sueldo.invalid && (sueldo.touched || employeeForm.submitted)" />
        <div class="invalid-feedback">Debe ser un valor mayor a 0.</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
        <button type="button" class="btn btn-outline-secondary" [disabled]="saving" (click)="cancel.emit()">
          {{ isEdit ? 'Cancelar' : 'Limpiar' }}
        </button>
      </div>
    </form>
  </div>
</div>
