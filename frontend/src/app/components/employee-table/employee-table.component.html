<div class="card shadow-sm">
  <div class="card-body">
    <h2 class="h5 card-title mb-3">Empleados <span class="badge bg-secondary">{{ employees.length }}</span></h2>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Cargo</th>
            <th>Departamento</th>
            <th class="text-end">Sueldo</th>
            <th class="text-end">Operaciones</th>
          </tr>
        </thead>
        <tbody>
          @for (employee of employees; track employee.id) {
            <tr [class.table-active]="employee.id === selectedId">
              <td>{{ employee.nombre }}</td>
              <td>{{ employee.cargo }}</td>
              <td>{{ employee.departamento }}</td>
              <td class="text-end">{{ employee.sueldo | currency: 'USD' }}</td>
              <td class="text-end text-nowrap">
                <button type="button" class="btn btn-sm btn-outline-primary me-1" [disabled]="disabled"
                        (click)="edit.emit(employee)">Editar</button>
                <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="disabled"
                        (click)="remove.emit(employee)">Eliminar</button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center text-muted py-4">No hay empleados registrados.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
